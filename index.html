<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="There is an opening. A monochrome browser experience about approaching, waiting, and being interrupted.">
  <title>Begin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23050505' d='M0 0h40v40H0z'/%3E%3Cpath fill='%23fff' d='M18 7h4v26h-4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=0.7.2">
</head>
<body data-screen="title">
  <canvas id="hall" aria-hidden="true"></canvas>
  <header class="masthead" id="masthead" hidden>
    <div class="time-panel"><time id="journey-time" aria-label="Time remaining">02:40</time></div>
    <nav class="controls" aria-label="Game controls">
      <button class="text-control" id="pause">Pause</button>
    </nav>
  </header>
  <main id="main">
    <section class="intro" id="intro" aria-label="Start">
      <button class="enter-button" id="enter">Begin</button>
    </section>
    <section class="journey" id="journey" aria-label="Approach the opening" hidden>
      <div class="task-heading" id="narrative"><p class="message" id="narrative-line" role="status">There is an opening.</p></div>
      <div class="next-step"><p id="phase-copy" role="status"></p><button class="advance-button" id="advance"><span id="advance-label">Approach</span><span aria-hidden="true">↑</span></button></div>
    </section>
    <section class="ending" id="ending" hidden aria-labelledby="end-title">
      <h2 id="end-title">You are still here.</h2>
      <button class="enter-button" id="replay">Again</button>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="ad-backdrop" id="ad-backdrop" hidden></div>
  <section class="ad-host" id="ad-host" hidden lang="zh-Hans" aria-label="游戏内模拟广告"></section>
  <div class="pause-overlay" id="pause-overlay" hidden>
    <section class="pause-sheet" role="dialog" aria-modal="true" aria-labelledby="pause-title" tabindex="-1">
      <h2 id="pause-title">Paused</h2>
      <button class="enter-button" id="resume">Resume</button>
      <button class="subtle-button" id="return-home">Back to start</button>
    </section>
  </div>
  <noscript><div class="noscript">Enable JavaScript to begin.</div></noscript>
  <script src="engine.js?v=0.7.2"></script>
  <script src="scene.js?v=0.7.2"></script>
  <script src="game.js?v=0.7.2"></script>
</body>
</html>
